[platformio]
src_dir = integration/firmware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200              
lib_extra_dirs = alan, piku ; each subfolder (alan/control, piku/radio...) becomes a library
build_flags = -I shared             

[env:bot1]
build_flags = ${env.build_flags} -D ROBOT_ID=1

; [env:bot2]
; build_flags = ${env.build_flags} -D ROBOT_ID=2
