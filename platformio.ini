[platformio]
src_dir = integration/firmware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200              
lib_extra_dirs = alan, piku ; each subfolder (alan/control, piku/radio...) becomes a library
build_flags = -I shared             

[env:s3test]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D ROBOT_ID=1 -D BOARD_S3

[env:bot1]
build_flags = ${env.build_flags} -D ROBOT_ID=1

; Test programs, built from a test folder instead of integration/firmware
; (paths are relative to src_dir). The plain names are for the regular ESP32;
; the _s3 versions are for the Freenove ESP32-S3 dev board.
[env:motor_test]
build_src_filter = -<*> +<../../alan/tests/motor_test/>

[env:imu_test]
build_src_filter = -<*> +<../../alan/tests/imu_test/>

[env:motor_test_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_S3
build_src_filter = -<*> +<../../alan/tests/motor_test/>

[env:imu_test_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BOARD_S3
build_src_filter = -<*> +<../../alan/tests/imu_test/>

; [env:bot2]
; build_flags = ${env.build_flags} -D ROBOT_ID=2
